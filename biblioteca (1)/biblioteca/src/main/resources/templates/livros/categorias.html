<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<h1>Categorias Cadastradas</h1>

<div class="livro" th:each="categoria : ${categorias}">
    <h3 th:text="${categoria.nome}"></h3>
    <p th:text="${categoria.descricao}"></p>
</div>

<a class="voltar" th:href="@{/livros}">
    Voltar ao menu principal
</a>

</body>
</html>
